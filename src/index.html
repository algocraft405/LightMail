<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https: http: theme:; frame-src 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Light Mail</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="wallpaper" hidden aria-hidden="true"></div>
  <div id="app">
    <header class="chrome">
      <div class="titlebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <img src="logo.png" alt="">
          </span>
          <span class="brand-name">Light Mail</span>
        </div>
        <label class="search-box">
          <span class="icon" style="-webkit-mask-image:url('icons/search.png');mask-image:url('icons/search.png')" aria-hidden="true"></span>
          <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
        </label>
        <div class="title-end">
        <div class="title-tools">
          <span id="updated-at" class="updated-at" hidden></span>
          <button type="button" class="icon-btn" data-action="open-settings" title="Settings" aria-label="Settings">
            <span class="icon" style="-webkit-mask-image:url('icons/settings.png');mask-image:url('icons/settings.png')" aria-hidden="true"></span>
          </button>
        </div>
        <div class="win-controls">
          <button type="button" class="win-btn" data-action="win-min" title="Minimize" aria-label="Minimize">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="square"/></svg>
          </button>
          <button type="button" class="win-btn" data-action="win-max" id="win-max" title="Maximize" aria-label="Maximize">
            <svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
          <button type="button" class="win-btn close" data-action="win-close" title="Close" aria-label="Close">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="square"/></svg>
          </button>
        </div>
        </div>
      </div>
      <div class="ribbon">
        <div class="ribbon-tabs" role="tablist" aria-label="Switch between mail and calendar">
          <button type="button" id="tab-mail" class="on" data-action="show-mail">Mail</button>
          <button type="button" id="tab-calendar" data-action="show-calendar">Calendar</button>
        </div>
        <div class="ribbon-body">
          <div id="commands" class="commands"></div>
        </div>
      </div>
      <div id="progress" hidden></div>
    </header>
    <div class="workspace">
      <nav id="nav" aria-label="Folders"></nav>
      <div class="splitter" data-split="nav" title="Resize folders"></div>
      <section id="list-pane" aria-label="Messages"></section>
      <div class="splitter" data-split="list" title="Resize message list"></div>
      <section id="reader" aria-label="Reading pane"></section>
    </div>
    <div id="calendar-root" hidden></div>
  </div>
  <div id="modal-root"></div>
  <div id="auth-overlay" hidden>
    <div class="dialog auth-dialog">
      <h2>Waiting for sign-in</h2>
      <p>Finish in the browser window that just opened, then come back here.</p>
      <div class="dialog-actions">
        <button type="button" data-action="cancel-auth">Cancel</button>
      </div>
    </div>
  </div>
  <div id="toast" role="status"></div>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/poll.js"></script>
  <script src="js/session.js"></script>
  <script src="js/mailbox.js"></script>
  <script src="js/compose.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
